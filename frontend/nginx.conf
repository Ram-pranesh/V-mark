server {
    listen 80;
    server_name _;

    # Serve static assets
    root /usr/share/nginx/html;
    index index.html;

    # Proxy backend APIs to the Flask service running in the docker-compose network
    location /firms/ {
        proxy_pass http://backend:5000/firms/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Allow SPA-style routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
