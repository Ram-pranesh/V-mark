<!DOCTYPE html>
<html lang="en">

<head>
  <title>V-mark</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@5.8.0/dist/maplibre-gl.css" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5.8.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/maplibre-contour@0.0.5/dist/index.min.js"></script>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<body>
  <!-- Sidebar Loading Skeleton -->
  <div id="sidebar-skeleton" class="skeleton-wrapper active" style="position: fixed; left: 0; top: 0; width: 340px; height: 100vh; background: rgba(10, 10, 10, 0.95); z-index: 1000; padding: 20px;">
    <div class="skeleton skeleton-title" style="width: 80%; height: 32px; margin-bottom: 24px;"></div>
    
    <div class="skeleton-layer-group">
      <div class="skeleton skeleton-layer-header"></div>
      <div class="skeleton skeleton-sidebar-item"></div>
      <div class="skeleton skeleton-sidebar-item"></div>
    </div>
    
    <div class="skeleton-layer-group">
      <div class="skeleton skeleton-layer-header"></div>
      <div class="skeleton skeleton-sidebar-item"></div>
      <div class="skeleton skeleton-sidebar-item"></div>
    </div>
    
    <div class="skeleton-layer-group">
      <div class="skeleton skeleton-layer-header"></div>
      <div class="skeleton skeleton-sidebar-item"></div>
      <div class="skeleton skeleton-sidebar-item"></div>
    </div>
  </div>

  <div id="sidebar" class="open loading-hidden">
    <div class="sidebar-header">
      <h2 style="display:flex; align-items:center; gap:10px; margin:0;">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ff6b35">
          <path
            d="M560-32v-80q117 0 198.5-81.5T840-392h80q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T560-32Zm0-160v-80q50 0 85-35t35-85h80q0 83-58.5 141.5T560-192ZM222-57q-15 0-30-6t-27-17L23-222q-11-12-17-27t-6-30q0-16 6-30.5T23-335l127-127q23-23 57-23.5t57 22.5l50 50 28-28-50-50q-23-23-23-56t23-56l57-57q23-23 56.5-23t56.5 23l50 50 28-28-50-50q-23-23-23-56.5t23-56.5l127-127q12-12 27-18t30-6q15 0 29.5 6t26.5 18l142 142q12 11 17.5 25.5T895-730q0 15-5.5 30T872-673L745-546q-23 23-56.5 23T632-546l-50-50-28 28 50 50q23 23 22.5 56.5T603-405l-56 56q-23 23-56.5 23T434-349l-50-50-28 28 50 50q23 23 22.5 57T405-207L278-80q-11 11-25.5 17T222-57Zm0-79 42-42-142-142-42 42 142 142Zm85-85 42-42-142-142-42 42 142 142Zm184-184 56-56-142-142-56 56 142 142Zm198-198 42-42-142-142-42 42 142 142Zm85-85 42-42-142-142-42 42 142 142ZM448-504Z" />
        </svg>
        <span>Satellite Telemetry</span>
      </h2>
    </div>

    <div class="sidebar-content">
      <div class="layer-group">
        <div class="group-title">
          <span class="material-icons-round">satellite</span> Satellite Feeds
        </div>

        <label class="layer-item">
          <input type="checkbox" id="sat-arcgis" checked onchange="toggleSatellite('arcgis')">
          <span>ArcGIS World Imagery</span>
        </label>

        <label class="layer-item">
          <input type="checkbox" id="sat-sentinel" onchange="toggleSatellite('sentinel')">
          <span>ESA Sentinel-2</span>
        </label>
      </div>

      <div class="layer-group">
        <div class="group-title">
          <span class="material-icons-round">air</span> Atmospheric
        </div>

        <label class="layer-item">
          <input type="checkbox" id="layer-wind" onchange="toggleLayer('wind-layer')">
          <span>Wind Speed</span>
        </label>

        <label class="layer-item">
          <input type="checkbox" id="layer-temp" onchange="toggleLayer('temp-layer')">
          <span>Global Temperature</span>
        </label>
      </div>


      <div class="layer-group">
        <div class="group-title">
          <span class="material-icons-round">settings</span> Tools
        </div>
        <div class="tool-row">
          <button id="sidebar-measure-btn" class="sidebar-tool-full-btn" title="Measure area">
            <div class="tool-icon">
              <span class="material-symbols-rounded">activity_zone</span>
            </div>
            <div class="tool-info">
              <div class="tool-label">Measure Area</div>
              <div id="sidebar-measure-info" class="sidebar-tool-info"></div>
            </div>
          </button>
        </div>
        <div class="tool-row">
          <button id="sidebar-route-btn" class="sidebar-tool-full-btn" title="Route Planner">
            <div class="tool-icon">
              <span class="material-symbols-rounded">conversion_path</span>
            </div>
            <div class="tool-info">
              <div class="tool-label">Route Planner</div>
              <div id="sidebar-route-info" class="sidebar-tool-info"></div>
            </div>
          </button>
        </div>
        <div class="tool-row"
          style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #333; justify-content: center;">
          <button id="sidebar-reset-btn" class="reset-tool-btn">
            <span class="material-icons-round" style="font-size: 16px; margin-right: 6px;">restart_alt</span> Reset
          </button>
        </div>
      </div>

      <div class="layer-group">
        <div class="group-title">
          <span class="material-icons-round">settings_system_daydream</span> System
        </div>

        <div class="layer-item" onclick="openAlertCenter()">
          <span class="material-icons-round"
            style="margin-right:12px; font-size:20px; color:#ff6b35;">notifications_none</span>
          <span>Alert System</span>
        </div>

        <div class="layer-item" onclick="toggleMonitoring()">
          <span class="material-icons-round" id="monitor-icon"
            style="margin-right:12px; font-size:20px; color:#aaa;">radar</span>
          <span id="monitor-text">Start Monitoring</span>
        </div>

        <div class="layer-item" onclick="simulateAlert()">
          <span class="material-icons-round" style="margin-right:12px; font-size:20px; color:#ffc107;">bug_report</span>
          <span>Test Verification</span>
        </div>



        <div class="layer-item" onclick="window.location.href='./drone-mode/index.html'">
          <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#4aa8ff"
            style="margin-right:12px;">
            <path
              d="M160-160q0-75 41-134.5T307-381l-10-99H160v-240H40v-80h320v80H240v160h48l-8-80h400l-8 80h48v-160H600v-80h321v80H801v240H664l-10 99q65 27 105.5 86.5T800-160h-80q0-66-47-113t-113-47H400q-66 0-113 47t-47 113h-80Zm225-240h189l17-160H368l17 160Zm0 0h189-189Z" />
          </svg>
          <span>Drone Telemetry</span>
        </div>
      </div>



    </div>
  </div>

  <button id="sidebar-toggle" onclick="toggleSidebar()" class="open loading-hidden" aria-label="Close sidebar">
    <span id="sidebar-toggle-icon" class="material-icons-round">menu_open</span>
  </button>

  <!-- Map Loading Skeleton -->
  <div id="map-skeleton" class="skeleton-wrapper active" style="position: fixed; top: 0; left: 340px; right: 0; bottom: 0; z-index: 999;">
    <div class="skeleton skeleton-map" style="height: 100%;"></div>
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #fff;">
      <div class="skeleton skeleton-circle" style="margin: 0 auto 16px;"></div>
      <div style="font-size: 18px; font-weight: 500;">Loading Map...</div>
      <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Initializing satellite feeds</div>
    </div>
  </div>

  <div id="map" class="sidebar-open loading-hidden"></div>
  <div id="temp-tooltip"
    style="position: absolute; display: none; background: rgba(10, 10, 10, 0.85); color: #fff; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); font-size: 14px; pointer-events: none; z-index: 100; backdrop-filter: blur(6px); box-shadow: 0 8px 32px rgba(0,0,0,0.5);">
  </div>
  <div id="wind-history-container" class="sidebar-open">
    <iframe id="wind-history-frame" src="./scripts/wind-history.html" title="Wind History"></iframe>
  </div>
  <div id="coords" class="sidebar-open"></div>
  <div id="dynamic-legend" class="legend-box" style="display:none;"></div>

  <script src="./scripts/app-bootstrap.js"></script>

  <script>
    // Hide skeletons and show content when everything is loaded
    function hideLoadingSkeletons() {
      // Hide all skeleton wrappers
      document.querySelectorAll('.skeleton-wrapper').forEach(el => {
        el.classList.remove('active');
        setTimeout(() => el.style.display = 'none', 300);
      });
      
      // Show all hidden content with fade-in
      document.querySelectorAll('.loading-hidden').forEach(el => {
        el.classList.remove('loading-hidden');
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s ease-in';
        setTimeout(() => el.style.opacity = '1', 50);
      });
    }

    // Call hide skeletons after map loads
    window.addEventListener('load', () => {
      // Wait for map to be fully initialized (check if map exists)
      const checkMap = setInterval(() => {
        if (window.map && map.loaded()) {
          clearInterval(checkMap);
          setTimeout(hideLoadingSkeletons, 500); // Small delay for smooth transition
        }
      }, 100);
      
      // Fallback: hide after 3 seconds even if map doesn't fully load
      setTimeout(() => {
        clearInterval(checkMap);
        hideLoadingSkeletons();
      }, 3000);
    });

    // Handle Auto-Routing from Alert Center
    window.addEventListener('load', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const action = urlParams.get('action');

      if (action === 'route') {
        const destLat = parseFloat(urlParams.get('lat'));
        const destLon = parseFloat(urlParams.get('lon'));

        if (!isNaN(destLat) && !isNaN(destLon)) {
          console.log("Auto-Routing requested to:", destLat, destLon);

          // Get User Location
          if (navigator.geolocation) {
            const statusDiv = document.createElement('div');
            Object.assign(statusDiv.style, {
              position: 'fixed',
              top: '80px',
              left: '50%',
              transform: 'translateX(-50%)',
              background: 'rgba(15, 15, 15, 0.95)',
              backdropFilter: 'blur(16px)',
              color: '#fff',
              padding: '16px 24px',
              borderRadius: '12px',
              zIndex: '10000',
              fontSize: '14px',
              fontWeight: '500',
              border: '1px solid rgba(255, 255, 255, 0.2)',
              boxShadow: '0 8px 32px rgba(0,0,0,0.5)',
              display: 'flex',
              alignItems: 'center',
              gap: '12px'
            });
            statusDiv.innerHTML = '<span class="material-icons-round" style="color: #4aa8ff;">my_location</span> Getting your location...';
            document.body.appendChild(statusDiv);

            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const userLat = pos.coords.latitude;
                const userLon = pos.coords.longitude;
                
                statusDiv.innerHTML = '<span class="material-icons-round" style="color: #0fa958;">navigation</span> Calculating route...';

                // Wait for map and calculateRoute to be ready
                const waitForMap = setInterval(() => {
                  if (window.calculateRoute && window.map && window.map.loaded()) {
                    clearInterval(waitForMap);
                    
                    // Small delay to ensure map is fully ready
                    setTimeout(() => {
                      if (document.body.contains(statusDiv)) document.body.removeChild(statusDiv);
                      
                      // Calculate Route - format: [lon, lat]
                      console.log("Starting route from user location:", [userLon, userLat], "to fire:", [destLon, destLat]);
                      window.calculateRoute([userLon, userLat], [destLon, destLat]);
                      
                      // Show success message
                      const successDiv = document.createElement('div');
                      Object.assign(successDiv.style, {
                        position: 'fixed',
                        top: '80px',
                        left: '50%',
                        transform: 'translateX(-50%)',
                        background: 'rgba(15, 183, 88, 0.95)',
                        backdropFilter: 'blur(16px)',
                        color: '#fff',
                        padding: '12px 20px',
                        borderRadius: '12px',
                        zIndex: '10000',
                        fontSize: '13px',
                        fontWeight: '600',
                        boxShadow: '0 8px 32px rgba(0,0,0,0.5)'
                      });
                      successDiv.innerHTML = '<span class="material-icons-round" style="font-size: 16px;">check_circle</span> Route calculated!';
                      document.body.appendChild(successDiv);
                      
                      setTimeout(() => {
                        if (document.body.contains(successDiv)) document.body.removeChild(successDiv);
                      }, 3000);
                    }, 500);
                  }
                }, 100);
              },
              (err) => {
                console.error("Geolocation failed:", err);
                statusDiv.innerHTML = '<span class="material-icons-round" style="color: #ff6b35;">location_off</span> Location access denied. Using demo location...';

                // Fallback to demo location (India center)
                const mockUserLon = 78.9629;
                const mockUserLat = 20.5937;

                setTimeout(() => {
                  if (document.body.contains(statusDiv)) document.body.removeChild(statusDiv);

                  const waitForMap = setInterval(() => {
                    if (window.calculateRoute && window.map && window.map.loaded()) {
                      clearInterval(waitForMap);
                      console.log("Starting route from demo location:", [mockUserLon, mockUserLat], "to fire:", [destLon, destLat]);
                      window.calculateRoute([mockUserLon, mockUserLat], [destLon, destLat]);
                    }
                  }, 100);
                }, 2000);
              },
              {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
              }
            );
          } else {
            alert("Geolocation is not supported by this browser.");
          }
        }
      }

      // Clear params to avoid loop on refresh
      if (action === 'route') {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const mapEl = document.getElementById("map");
      const windHistory = document.getElementById("wind-history-container");
      const coords = document.getElementById("coords");
      const toggle = document.getElementById("sidebar-toggle");
      const icon = document.getElementById("sidebar-toggle-icon");

      sidebar.classList.toggle("open");
      mapEl.classList.toggle("sidebar-open");
      windHistory.classList.toggle("sidebar-open");
      coords.classList.toggle("sidebar-open");
      toggle.classList.toggle("open");

      const isOpen = sidebar.classList.contains("open");
      icon.textContent = isOpen ? "menu_open" : "menu";
      toggle.setAttribute("aria-label", isOpen ? "Close sidebar" : "Open sidebar");

      // Call resize after transition completes
      setTimeout(() => {
        if (window.map && typeof map.resize === 'function') map.resize();
      }, 350);
    }

    function setWindHistoryVisible(visible) {
      const windHistory = document.getElementById("wind-history-container");
      const mapEl = document.getElementById("map");
      const coords = document.getElementById("coords");
      const terrainToggle = document.querySelector(".floating-terrain-toggle");
      const mapSelector = document.querySelector(".floating-map-selector");

      if (!windHistory || !mapEl || !coords) return;
      windHistory.style.display = visible ? "block" : "none";
      mapEl.style.display = "block";
      coords.style.display = "block";
      if (terrainToggle) terrainToggle.style.display = "flex";
      if (mapSelector) mapSelector.style.display = "flex";
      if (window.map && map.resize) map.resize();
    }

    // Satellite Mutex Logic
    function toggleSatellite(selected) {
      const arcgis = document.getElementById('sat-arcgis');
      const sentinel = document.getElementById('sat-sentinel');
      const mapSkeleton = document.getElementById('map-skeleton');
      const mapEl = document.getElementById('map');
      
      // Show skeleton
      if (mapSkeleton) {
        mapSkeleton.style.display = 'block';
        mapSkeleton.classList.add('active');
      }
      if (mapEl) mapEl.classList.add('loading-hidden');
      
      if (selected === 'arcgis') {
        if (arcgis.checked) {
          sentinel.checked = false;
          if (map.getLayer('satellite')) map.setLayoutProperty('satellite', 'visibility', 'visible');
          if (map.getLayer('sentinel-2')) map.setLayoutProperty('sentinel-2', 'visibility', 'none');

          // Hide boundaries for ArcGIS
          ['country-borders', 'state-borders', 'state-fills', 'state-labels'].forEach(id => {
            if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none');
          });
        } else {
          // Prevent unchecking both (fallback to base)
          arcgis.checked = true;
        }
      } else {
        if (sentinel.checked) {
          arcgis.checked = false;
          if (map.getLayer('sentinel-2')) map.setLayoutProperty('sentinel-2', 'visibility', 'visible');
          if (map.getLayer('satellite')) map.setLayoutProperty('satellite', 'visibility', 'none');

          // Show boundaries for Sentinel-2
          ['country-borders', 'state-borders', 'state-fills', 'state-labels'].forEach(id => {
            if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'visible');
          });

        } else {
          arcgis.checked = true;
          if (map.getLayer('satellite')) map.setLayoutProperty('satellite', 'visibility', 'visible');
          if (map.getLayer('sentinel-2')) map.setLayoutProperty('sentinel-2', 'visibility', 'none');

          // Hide boundaries for ArcGIS
          ['country-borders', 'state-borders', 'state-fills', 'state-labels'].forEach(id => {
            if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none');
          });
        }
      }

      syncFireVisibility();
      
      // Hide skeleton after loading
      setTimeout(() => {
        if (mapSkeleton) {
          mapSkeleton.style.display = 'none';
          mapSkeleton.classList.remove('active');
        }
        if (mapEl) mapEl.classList.remove('loading-hidden');
      }, 800);

    }

    // Generic Layer Toggle
    function toggleLayer(mapLayerId) {
      const domId = 'layer-' + mapLayerId.replace('-layer', '');
      const checkbox = document.getElementById(domId);
      if (!checkbox) return;

      // Show skeleton loading for atmospheric layers
      if (mapLayerId === 'wind-layer' || mapLayerId === 'temp-layer') {
        const mapSkeleton = document.getElementById('map-skeleton');
        const mapEl = document.getElementById('map');
        
        if (mapSkeleton) {
          mapSkeleton.style.display = 'block';
          mapSkeleton.classList.add('active');
        }
        if (mapEl) mapEl.classList.add('loading-hidden');
        
        // Hide skeleton after map is idle
        const hideSkeletonOnIdle = () => {
          setTimeout(() => {
            if (mapSkeleton) {
              mapSkeleton.style.display = 'none';
              mapSkeleton.classList.remove('active');
            }
            if (mapEl) mapEl.classList.remove('loading-hidden');
          }, 1000);
          map.off('idle', hideSkeletonOnIdle);
        };
        
        map.once('idle', hideSkeletonOnIdle);
      }

      // Atmospheric layers should be mutually exclusive
      if (mapLayerId === 'wind-layer' || mapLayerId === 'temp-layer') {
        const otherId = mapLayerId === 'wind-layer' ? 'temp-layer' : 'wind-layer';
        const otherCheckbox = document.getElementById('layer-' + otherId.replace('-layer', ''));
        if (otherCheckbox) otherCheckbox.checked = false;
      }

      if (mapLayerId === 'wind-layer') {
        const tempCheckbox = document.getElementById('layer-temp');
        if (tempCheckbox) tempCheckbox.checked = false;
        if (map.getLayer('temp-layer')) map.setLayoutProperty('temp-layer', 'visibility', 'none');
        updateLegend('temp-layer', false);
        const tooltip = document.getElementById('temp-tooltip');
        if (tooltip) tooltip.style.display = 'none';

        setWindHistoryVisible(checkbox.checked);
        if (map.getLayer('wind-layer')) map.setLayoutProperty('wind-layer', 'visibility', checkbox.checked ? 'visible' : 'none');
        const arcgis = document.getElementById('sat-arcgis');
        const sentinel = document.getElementById('sat-sentinel');
        if (arcgis && sentinel && !arcgis.checked && !sentinel.checked) {
          arcgis.checked = true;
        }
        if (map.getLayer('satellite')) map.setLayoutProperty('satellite', 'visibility', arcgis && arcgis.checked ? 'visible' : 'none');
        if (map.getLayer('sentinel-2')) map.setLayoutProperty('sentinel-2', 'visibility', sentinel && sentinel.checked ? 'visible' : 'none');
        syncFireVisibility();
        updateLegend(mapLayerId, checkbox.checked);
        return;
      }

      if (mapLayerId === 'temp-layer') {
        setWindHistoryVisible(false);
        const windCheckbox = document.getElementById('layer-wind');
        if (windCheckbox) windCheckbox.checked = false;
        updateLegend('wind-layer', false);
        if (map.getLayer('wind-layer')) map.setLayoutProperty('wind-layer', 'visibility', 'none');
        if (checkbox.checked) {
          // Show temperature overlay on top of the active satellite
          const arcgis = document.getElementById('sat-arcgis');
          const sentinel = document.getElementById('sat-sentinel');
          if (arcgis && sentinel && !arcgis.checked && !sentinel.checked) {
            arcgis.checked = true;
          }
          if (map.getLayer('satellite')) map.setLayoutProperty('satellite', 'visibility', arcgis && arcgis.checked ? 'visible' : 'none');
          if (map.getLayer('sentinel-2')) map.setLayoutProperty('sentinel-2', 'visibility', sentinel && sentinel.checked ? 'visible' : 'none');
          if (map.getLayer('temp-layer')) map.setLayoutProperty('temp-layer', 'visibility', 'visible');
          setupTempTooltip();
          syncFireVisibility();
        } else {
          // Hide temperature overlay, keep active satellite
          const arcgis = document.getElementById('sat-arcgis');
          const sentinel = document.getElementById('sat-sentinel');
          if (arcgis && sentinel && !arcgis.checked && !sentinel.checked) {
            arcgis.checked = true;
          }
          if (map.getLayer('satellite')) map.setLayoutProperty('satellite', 'visibility', arcgis && arcgis.checked ? 'visible' : 'none');
          if (map.getLayer('sentinel-2')) map.setLayoutProperty('sentinel-2', 'visibility', sentinel && sentinel.checked ? 'visible' : 'none');
          if (map.getLayer('temp-layer')) map.setLayoutProperty('temp-layer', 'visibility', 'none');
          const tooltip = document.getElementById('temp-tooltip');
          if (tooltip) tooltip.style.display = 'none';
          syncFireVisibility();
        }
        updateLegend(mapLayerId, checkbox.checked);
        return;
      }

      // For other layers
      if (!window.map || !map.getLayer || !map.getLayer(mapLayerId)) return;
      map.setLayoutProperty(mapLayerId, 'visibility', checkbox.checked ? 'visible' : 'none');
      updateLegend(mapLayerId, checkbox.checked);
    }

    // Fire visibility only on satellite feeds and when temperature overlay is off
    function syncFireVisibility() {
      const tempOn = document.getElementById('layer-temp')?.checked;
      const arcgis = document.getElementById('sat-arcgis');
      const sentinel = document.getElementById('sat-sentinel');
      const mapMode = window.mapSelect ? window.mapSelect.value : 'satellite';
      const show = !tempOn && mapMode === 'satellite' && ((arcgis && arcgis.checked) || (sentinel && sentinel.checked));
      ['fire-glow', 'fire-points', 'firms-fires-layer'].forEach((id) => {
        if (map.getLayer && map.getLayer(id)) {
          map.setLayoutProperty(id, 'visibility', show ? 'visible' : 'none');
        }
      });
    }

    function updateLegend(layer, visible) {
      const legend = document.getElementById('dynamic-legend');
      if (!visible) { legend.style.display = 'none'; return; }

      legend.style.display = 'block';
      if (layer.includes('wind')) legend.innerHTML = '<b>Wind Speed</b><br><span style="background:linear-gradient(90deg, #5b00a5 0%, #7516c7 14%, #3b5fff 28%, #1fa4ff 42%, #1dd2b7 56%, #7ddc3a 70%, #f2e30c 82%, #ff9a00 91%, #ff2f00 100%); display:block; height:10px; width:100%; border-radius:4px;"></span><div style="display:flex; justify-content:space-between; font-size:12px; margin-top:4px;"><span>Low</span><span>High</span></div>';
      if (layer.includes('temp')) legend.innerHTML = '<b>Temperature</b><br><span style="background:linear-gradient(90deg, #5b00a5 0%, #7a1fcf 12%, #3657ff 24%, #1fa4ff 36%, #18d17c 48%, #c2e51b 60%, #ffd400 72%, #ff9a00 84%, #ff2f00 100%); display:block; height:10px; width:100%; border-radius:4px;"></span><div style="display:flex; justify-content:space-between; font-size:12px; margin-top:4px;"><span>-40°C</span><span>40°C</span></div>';
    }

    // Setup temperature tooltip for main map
    function setupTempTooltip() {
      const tooltip = document.getElementById('temp-tooltip');
      let timer;
      let lastRequestId = 0;

      map.on('mousemove', (e) => {
        const tempCheckbox = document.getElementById('layer-temp');
        if (!tempCheckbox || !tempCheckbox.checked) {
          tooltip.style.display = 'none';
          return;
        }

        const rect = map.getContainer().getBoundingClientRect();
        tooltip.style.display = 'block';
        tooltip.style.left = (rect.left + e.point.x + 6) + 'px';
        tooltip.style.top = (rect.top + e.point.y + 6) + 'px';
        tooltip.style.transform = 'none';

        clearTimeout(timer);
        timer = setTimeout(() => {
          const requestId = ++lastRequestId;
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${e.lngLat.lat}&longitude=${e.lngLat.lng}&current=temperature_2m`)
            .then(res => res.json())
            .then(data => {
              if (requestId !== lastRequestId) return; // drop stale responses
              if (data.current) {
                tooltip.innerHTML = `<div style="font-weight:bold; font-size:16px;">${Math.round(data.current.temperature_2m)}°C</div>`;
              }
            })
            .catch(() => { });
        }, 100);
      });

      map.on('mouseout', () => {
        const tooltip = document.getElementById('temp-tooltip');
        if (tooltip) tooltip.style.display = 'none';
      });
    }


    function openAlertCenter(data = null) {
      if (data) {
        sessionStorage.setItem('alertData', JSON.stringify(data));
      } else {
        sessionStorage.removeItem('alertData');
      }
      window.location.href = 'alert-center.html';
    }

    // Monitoring Logic
    let monitoringInterval = null;
    let isMonitoring = false;

    function toggleMonitoring() {
      const icon = document.getElementById('monitor-icon');
      const text = document.getElementById('monitor-text');

      if (isMonitoring) {
        // Stop
        clearInterval(monitoringInterval);
        isMonitoring = false;
        icon.style.color = '#aaa';
        text.textContent = 'Start Monitoring';
        text.style.color = '#aaa';
        alert("Monitoring Stopped");
      } else {
        // Start
        isMonitoring = true;
        icon.style.color = '#28a745';
        text.textContent = 'Monitoring Active...';
        text.style.color = '#28a745';

        // Trigger check every 10 seconds (or immediately)
        checkFireStatus();
        monitoringInterval = setInterval(checkFireStatus, 15000); // Check every 15s
      }
    }

    async function checkFireStatus(simulate = false) {
      if (!window.map) return;
      const center = map.getCenter();

      console.log(`Running verification (Simulate: ${simulate})...`);
      try {
        const body = { lat: center.lat, lon: center.lng };
        if (simulate) body.simulate = true;

        const response = await fetch('/api/verify-fire', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (response.ok) {
          const result = await response.json();
          console.log("Verification Result:", result);

          if (result.alert_generated) {
            // STOP monitoring if active
            if (isMonitoring) toggleMonitoring();

            // Small delay to let user see change or just redirect
            const msg = simulate ? "SIMULATION: Fire Detected!" : "CRITICAL: Fire Detected!";
            alert(`${msg}\nRedirecting to Alert Centre...`);
            openAlertCenter(result);
          } else if (simulate) {
            alert("Simulation Result: No Fire Detected.");
          }
        }
      } catch (e) {
        console.error("Monitoring error", e);
      }
    }

    function simulateAlert() {
      if (confirm("Run a simulated verification test? This will trigger a positive fire result without using the webcam.")) {
        checkFireStatus(true);
      }
    }

  </script>
</body>
