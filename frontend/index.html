<!DOCTYPE html>
<html lang="en">

<head>
  <title>V-mark</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@5.8.0/dist/maplibre-gl.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5.8.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/maplibre-contour@0.0.5/dist/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<body>
  <div id="sidebar" class="open">
    <div class="sidebar-header">
      <h2 style="display:flex; align-items:center; gap:10px; margin:0;">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ff6b35">
          <path
            d="M560-32v-80q117 0 198.5-81.5T840-392h80q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T560-32Zm0-160v-80q50 0 85-35t35-85h80q0 83-58.5 141.5T560-192ZM222-57q-15 0-30-6t-27-17L23-222q-11-12-17-27t-6-30q0-16 6-30.5T23-335l127-127q23-23 57-23.5t57 22.5l50 50 28-28-50-50q-23-23-23-56t23-56l57-57q23-23 56.5-23t56.5 23l50 50 28-28-50-50q-23-23-23-56.5t23-56.5l127-127q12-12 27-18t30-6q15 0 29.5 6t26.5 18l142 142q12 11 17.5 25.5T895-730q0 15-5.5 30T872-673L745-546q-23 23-56.5 23T632-546l-50-50-28 28 50 50q23 23 22.5 56.5T603-405l-56 56q-23 23-56.5 23T434-349l-50-50-28 28 50 50q23 23 22.5 57T405-207L278-80q-11 11-25.5 17T222-57Zm0-79 42-42-142-142-42 42 142 142Zm85-85 42-42-142-142-42 42 142 142Zm184-184 56-56-142-142-56 56 142 142Zm198-198 42-42-142-142-42 42 142 142Zm85-85 42-42-142-142-42 42 142 142ZM448-504Z" />
        </svg>
        <span>Satellite Telemetry</span>
      </h2>
    </div>

    <div class="sidebar-content">
      <div class="layer-group" style="flex-shrink: 0; margin-bottom: 10px;">
        <div class="group-title">
          <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#ff6b35"
            style="margin-right:8px;">
            <path
              d="M440-40v-80q-125-14-214.5-103.5T122-438H42v-80h80q14-125 103.5-214.5T440-836v-80h80v80q125 14 214.5 103.5T838-518h80v80h-80q-14 125-103.5 214.5T520-120v80h-80Zm40-158q116 0 198-82t82-198q0-116-82-198t-198-82q-116 0-198 82t-82 198q0 116 82 198t198 82Z" />
          </svg>
          Satellite Feeds
        </div>

        <label class="layer-item">
          <input type="checkbox" id="sat-arcgis" checked onchange="toggleSatellite('arcgis')">
          <span>ArcGIS World Imagery</span>
        </label>

        <label class="layer-item">
          <input type="checkbox" id="sat-sentinel" onchange="toggleSatellite('sentinel')">
          <span>ESA Sentinel-2</span>
        </label>

        <!-- Sources Dropdown -->
        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #333;">
          <div style="font-size: 11px; color: #888; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
            <span class="material-icons-round" style="font-size: 14px; color: #ff6b35;">filter_alt</span>
            FIRE DATA SOURCES
          </div>
          <div class="dropdown" id="sources-dropdown">
            <button class="dropdown-toggle" onclick="toggleDropdown('sources-dropdown')">
              <span id="sources-label">All Sources</span>
              <span class="material-icons-round">expand_more</span>
            </button>
            <div class="dropdown-menu">
              <label class="dropdown-item">
                <input type="checkbox" id="source-all" checked onchange="toggleAllSources()">
                <span>All Sources</span>
              </label>
              <label class="dropdown-item">
                <input type="checkbox" id="source-modis" checked onchange="toggleIndividualSource()">
                <span>MODIS Terra/Aqua</span>
              </label>
              <label class="dropdown-item">
                <input type="checkbox" id="source-viirs-snpp" checked onchange="toggleIndividualSource()">
                <span>VIIRS SNPP</span>
              </label>
              <label class="dropdown-item">
                <input type="checkbox" id="source-viirs-noaa20" checked onchange="toggleIndividualSource()">
                <span>VIIRS NOAA-20</span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="layer-group" style="flex-shrink: 0; margin-bottom: 10px;">
        <div class="group-title">
          <span class="material-icons-round">air</span> Atmospheric
        </div>

        <label class="layer-item">
          <input type="checkbox" id="layer-wind" onchange="toggleLayer('wind-layer')">
          <span>Wind Speed</span>
        </label>

        <label class="layer-item">
          <input type="checkbox" id="layer-temp" onchange="toggleLayer('temp-layer')">
          <span>Global Temperature</span>
        </label>
      </div>


      <div class="layer-group" style="flex-shrink: 0; margin-bottom: 2px; padding: 8px;">
        <div class="group-title" style="margin-bottom: 6px;">
          <span class="material-icons-round">settings</span> Tools
        </div>
        <div class="tool-row" style="margin-bottom: 6px; gap: 6px;">
          <button id="sidebar-measure-btn" class="sidebar-tool-compact-btn" title="Measure area" style="padding: 6px;">
            <span class="material-symbols-rounded" style="font-size: 16px;">activity_zone</span>
            <span style="font-size: 12px;">Measure</span>
          </button>
          <button id="sidebar-route-btn" class="sidebar-tool-compact-btn" title="Route Planner" style="padding: 6px;">
            <span class="material-symbols-rounded" style="font-size: 16px;">conversion_path</span>
            <span style="font-size: 12px;">Route</span>
          </button>
        </div>
        <div class="tool-row" style="justify-content: center;">
          <button id="sidebar-reset-btn" class="reset-tool-btn" style="padding: 4px 10px; font-size: 10px;">
            <span class="material-icons-round" style="font-size: 12px; margin-right: 3px;">restart_alt</span> Reset
          </button>
        </div>
      </div>

      <div class="layer-group" style="flex-shrink: 0; margin-bottom: 0; padding: 18px;">
        <div class="group-title" style="margin-bottom: 12px;">
          <span class="material-icons-round">settings_system_daydream</span> System
        </div>

        <div class="layer-item"
          onclick="if(window.openAlertCenter) window.openAlertCenter(); else alert('Alert System Loading...');"
          style="padding: 10px 12px;">
          <span class="material-icons-round"
            style="margin-right:12px; font-size:22px; color:#ff6b35;">notifications_none</span>
          <span style="font-size: 0.95rem;">Alert System</span>
        </div>

        <div class="layer-item" onclick="window.location.href='./drone-mode/index.html'" style="padding: 10px 12px;">
          <svg xmlns="http://www.w3.org/2000/svg" height="22px" viewBox="0 -960 960 960" width="22px" fill="#4aa8ff"
            style="margin-right:12px;">
            <path
              d="M160-160q0-75 41-134.5T307-381l-10-99H160v-240H40v-80h320v80H240v160h48l-8-80h400l-8 80h48v-160H600v-80h321v80H801v240H664l-10 99q65 27 105.5 86.5T800-160h-80q0-66-47-113t-113-47H400q-66 0-113 47t-47 113h-80Zm225-240h189l17-160H368l17 160Zm0 0h189-189Z" />
          </svg>
          <span style="font-size: 0.95rem;">Drone Telemetry</span>
        </div>
      </div>



    </div>
  </div>

  <button id="sidebar-toggle" onclick="toggleSidebar()" class="open" aria-label="Close sidebar">
    <span id="sidebar-toggle-icon" class="material-icons-round">menu_open</span>
  </button>

  <div id="map" class="sidebar-open"></div>
  <div id="temp-tooltip"
    style="position: absolute; display: none; background: rgba(10, 10, 10, 0.85); color: #fff; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); font-size: 14px; pointer-events: none; z-index: 100; backdrop-filter: blur(6px); box-shadow: 0 8px 32px rgba(0,0,0,0.5);">
  </div>
  <div id="wind-history-container" class="sidebar-open">
    <iframe id="wind-history-frame" src="./scripts/wind-history.html" title="Wind History"></iframe>
  </div>
  <div id="coords" class="sidebar-open"></div>
  <div id="dynamic-legend" class="legend-box" style="display:none;"></div>

  <script src="./scripts/app-bootstrap.js"></script>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const mapEl = document.getElementById("map");
      const windHistory = document.getElementById("wind-history-container");
      const coords = document.getElementById("coords");
      const toggle = document.getElementById("sidebar-toggle");
      const icon = document.getElementById("sidebar-toggle-icon");

      sidebar.classList.toggle("open");
      mapEl.classList.toggle("sidebar-open");
      windHistory.classList.toggle("sidebar-open");
      coords.classList.toggle("sidebar-open");
      toggle.classList.toggle("open");

      const isOpen = sidebar.classList.contains("open");
      icon.textContent = isOpen ? "menu_open" : "menu";
      toggle.setAttribute("aria-label", isOpen ? "Close sidebar" : "Open sidebar");

      // Call resize after transition completes
      setTimeout(() => {
        if (window.map && typeof map.resize === 'function') map.resize();
      }, 350);
    }

    function setWindHistoryVisible(visible) {
      const windHistory = document.getElementById("wind-history-container");
      const mapEl = document.getElementById("map");
      const coords = document.getElementById("coords");
      const terrainToggle = document.querySelector(".floating-terrain-toggle");
      const mapSelector = document.querySelector(".floating-map-selector");

      if (!windHistory || !mapEl || !coords) return;
      windHistory.style.display = visible ? "block" : "none";
      mapEl.style.display = "block";
      coords.style.display = "block";
      if (terrainToggle) terrainToggle.style.display = "flex";
      if (mapSelector) mapSelector.style.display = "flex";
      if (window.map && map.resize) map.resize();
    }

    // Satellite Mutex Logic
    function toggleSatellite(selected) {
      const arcgis = document.getElementById('sat-arcgis');
      const sentinel = document.getElementById('sat-sentinel');
      if (selected === 'arcgis') {
        if (arcgis.checked) {
          sentinel.checked = false;
          if (map.getLayer('satellite')) map.setLayoutProperty('satellite', 'visibility', 'visible');
          if (map.getLayer('sentinel-2')) map.setLayoutProperty('sentinel-2', 'visibility', 'none');

          // Hide boundaries for ArcGIS
          ['country-borders', 'state-borders', 'state-fills', 'state-labels'].forEach(id => {
            if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none');
          });
        } else {
          // Prevent unchecking both (fallback to base)
          arcgis.checked = true;
        }
      } else {
        if (sentinel.checked) {
          arcgis.checked = false;
          if (map.getLayer('sentinel-2')) map.setLayoutProperty('sentinel-2', 'visibility', 'visible');
          if (map.getLayer('satellite')) map.setLayoutProperty('satellite', 'visibility', 'none');

          // Show boundaries AND labels for Sentinel-2
          ['country-borders', 'country-labels', 'state-borders', 'state-fills', 'state-labels'].forEach(id => {
            if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'visible');
          });

        } else {
          arcgis.checked = true;
          if (map.getLayer('satellite')) map.setLayoutProperty('satellite', 'visibility', 'visible');
          if (map.getLayer('sentinel-2')) map.setLayoutProperty('sentinel-2', 'visibility', 'none');

          // Hide boundaries for ArcGIS
          ['country-borders', 'country-labels', 'state-borders', 'state-fills', 'state-labels'].forEach(id => {
            if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none');
          });
        }
      }

      syncFireVisibility();

    }

    // Dropdown Toggle
    function toggleDropdown(dropdownId) {
      const dropdown = document.getElementById(dropdownId);
      if (dropdown) {
        dropdown.classList.toggle('open');
      }
      // Close other dropdowns
      document.querySelectorAll('.dropdown').forEach(d => {
        if (d.id !== dropdownId) d.classList.remove('open');
      });
    }

    // Close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.dropdown')) {
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
      }
    });

    // Source Filter Functions
    function toggleAllSources() {
      const allCheckbox = document.getElementById('source-all');
      const modis = document.getElementById('source-modis');
      const viirs_snpp = document.getElementById('source-viirs-snpp');
      const viirs_noaa20 = document.getElementById('source-viirs-noaa20');

      if (allCheckbox.checked) {
        modis.checked = true;
        viirs_snpp.checked = true;
        viirs_noaa20.checked = true;
      } else {
        modis.checked = false;
        viirs_snpp.checked = false;
        viirs_noaa20.checked = false;
      }

      updateSourcesLabel();
      reloadFireData();
    }

    function toggleIndividualSource() {
      const allCheckbox = document.getElementById('source-all');
      const modis = document.getElementById('source-modis');
      const viirs_snpp = document.getElementById('source-viirs-snpp');
      const viirs_noaa20 = document.getElementById('source-viirs-noaa20');

      // Update "All" checkbox based on individual selections
      allCheckbox.checked = modis.checked && viirs_snpp.checked && viirs_noaa20.checked;

      updateSourcesLabel();
      reloadFireData();
    }

    function updateSourcesLabel() {
      const modis = document.getElementById('source-modis');
      const viirs_snpp = document.getElementById('source-viirs-snpp');
      const viirs_noaa20 = document.getElementById('source-viirs-noaa20');
      const label = document.getElementById('sources-label');

      const selected = [];
      if (modis && modis.checked) selected.push('MODIS');
      if (viirs_snpp && viirs_snpp.checked) selected.push('VIIRS SNPP');
      if (viirs_noaa20 && viirs_noaa20.checked) selected.push('VIIRS NOAA-20');

      if (selected.length === 3) {
        label.textContent = 'All Sources';
      } else if (selected.length === 0) {
        label.textContent = 'No Sources';
      } else {
        label.textContent = selected.join(', ');
      }
    }

    function reloadFireData() {
      // Update enabled sources
      if (!window.enabledSources) {
        window.enabledSources = new Set();
      } else {
        window.enabledSources.clear();
      }

      if (document.getElementById('source-modis')?.checked) {
        window.enabledSources.add('MODIS_NRT');
      }
      if (document.getElementById('source-viirs-snpp')?.checked) {
        window.enabledSources.add('VIIRS_SNPP_NRT');
      }
      if (document.getElementById('source-viirs-noaa20')?.checked) {
        window.enabledSources.add('VIIRS_NOAA20_NRT');
      }

      // Reload fire data
      if (window.loadFires) {
        window.loadFires();
      }
    }

    // Generic Layer Toggle
    function toggleLayer(mapLayerId) {
      const domId = 'layer-' + mapLayerId.replace('-layer', '');
      const checkbox = document.getElementById(domId);
      if (!checkbox) return;

      // Atmospheric layers should be mutually exclusive
      if (mapLayerId === 'wind-layer' || mapLayerId === 'temp-layer') {
        const otherId = mapLayerId === 'wind-layer' ? 'temp-layer' : 'wind-layer';
        const otherCheckbox = document.getElementById('layer-' + otherId.replace('-layer', ''));
        if (otherCheckbox) otherCheckbox.checked = false;
      }

      if (mapLayerId === 'wind-layer') {
        const tempCheckbox = document.getElementById('layer-temp');
        if (tempCheckbox) tempCheckbox.checked = false;
        if (map.getLayer('temp-layer')) map.setLayoutProperty('temp-layer', 'visibility', 'none');
        updateLegend('temp-layer', false);
        const tooltip = document.getElementById('temp-tooltip');
        if (tooltip) tooltip.style.display = 'none';

        setWindHistoryVisible(checkbox.checked);
        if (map.getLayer('wind-layer')) map.setLayoutProperty('wind-layer', 'visibility', checkbox.checked ? 'visible' : 'none');
        const arcgis = document.getElementById('sat-arcgis');
        const sentinel = document.getElementById('sat-sentinel');
        if (arcgis && sentinel && !arcgis.checked && !sentinel.checked) {
          arcgis.checked = true;
        }
        if (map.getLayer('satellite')) map.setLayoutProperty('satellite', 'visibility', arcgis && arcgis.checked ? 'visible' : 'none');
        if (map.getLayer('sentinel-2')) map.setLayoutProperty('sentinel-2', 'visibility', sentinel && sentinel.checked ? 'visible' : 'none');
        syncFireVisibility();
        updateLegend(mapLayerId, checkbox.checked);
        return;
      }

      if (mapLayerId === 'temp-layer') {
        setWindHistoryVisible(false);
        const windCheckbox = document.getElementById('layer-wind');
        if (windCheckbox) windCheckbox.checked = false;
        updateLegend('wind-layer', false);
        if (map.getLayer('wind-layer')) map.setLayoutProperty('wind-layer', 'visibility', 'none');
        if (checkbox.checked) {
          // Show temperature overlay on top of the active satellite
          const arcgis = document.getElementById('sat-arcgis');
          const sentinel = document.getElementById('sat-sentinel');
          if (arcgis && sentinel && !arcgis.checked && !sentinel.checked) {
            arcgis.checked = true;
          }
          if (map.getLayer('satellite')) map.setLayoutProperty('satellite', 'visibility', arcgis && arcgis.checked ? 'visible' : 'none');
          if (map.getLayer('sentinel-2')) map.setLayoutProperty('sentinel-2', 'visibility', sentinel && sentinel.checked ? 'visible' : 'none');
          if (map.getLayer('temp-layer')) map.setLayoutProperty('temp-layer', 'visibility', 'visible');
          setupTempTooltip();
          syncFireVisibility();
        } else {
          // Hide temperature overlay, keep active satellite
          const arcgis = document.getElementById('sat-arcgis');
          const sentinel = document.getElementById('sat-sentinel');
          if (arcgis && sentinel && !arcgis.checked && !sentinel.checked) {
            arcgis.checked = true;
          }
          if (map.getLayer('satellite')) map.setLayoutProperty('satellite', 'visibility', arcgis && arcgis.checked ? 'visible' : 'none');
          if (map.getLayer('sentinel-2')) map.setLayoutProperty('sentinel-2', 'visibility', sentinel && sentinel.checked ? 'visible' : 'none');
          if (map.getLayer('temp-layer')) map.setLayoutProperty('temp-layer', 'visibility', 'none');
          const tooltip = document.getElementById('temp-tooltip');
          if (tooltip) tooltip.style.display = 'none';
          syncFireVisibility();
        }
        updateLegend(mapLayerId, checkbox.checked);
        return;
      }

      // For other layers
      if (!window.map || !map.getLayer || !map.getLayer(mapLayerId)) return;
      map.setLayoutProperty(mapLayerId, 'visibility', checkbox.checked ? 'visible' : 'none');
      updateLegend(mapLayerId, checkbox.checked);
    }

    // Fire visibility only on satellite feeds and when temperature overlay is off
    function syncFireVisibility() {
      const tempOn = document.getElementById('layer-temp')?.checked;
      const arcgis = document.getElementById('sat-arcgis');
      const sentinel = document.getElementById('sat-sentinel');
      const mapMode = window.mapSelect ? window.mapSelect.value : 'satellite';
      const show = !tempOn && mapMode === 'satellite' && ((arcgis && arcgis.checked) || (sentinel && sentinel.checked));
      ['fire-glow', 'fire-points', 'firms-fires-layer'].forEach((id) => {
        if (map.getLayer && map.getLayer(id)) {
          map.setLayoutProperty(id, 'visibility', show ? 'visible' : 'none');
        }
      });
    }

    function updateLegend(layer, visible) {
      const legend = document.getElementById('dynamic-legend');
      if (!visible) { legend.style.display = 'none'; return; }

      legend.style.display = 'block';
      if (layer.includes('wind')) legend.innerHTML = '<b>Wind Speed</b><br><span style="background:linear-gradient(90deg, #5b00a5 0%, #7516c7 14%, #3b5fff 28%, #1fa4ff 42%, #1dd2b7 56%, #7ddc3a 70%, #f2e30c 82%, #ff9a00 91%, #ff2f00 100%); display:block; height:10px; width:100%; border-radius:4px;"></span><div style="display:flex; justify-content:space-between; font-size:12px; margin-top:4px;"><span>Low</span><span>High</span></div>';
      if (layer.includes('temp')) legend.innerHTML = '<b>Temperature</b><br><span style="background:linear-gradient(90deg, #5b00a5 0%, #7a1fcf 12%, #3657ff 24%, #1fa4ff 36%, #18d17c 48%, #c2e51b 60%, #ffd400 72%, #ff9a00 84%, #ff2f00 100%); display:block; height:10px; width:100%; border-radius:4px;"></span><div style="display:flex; justify-content:space-between; font-size:12px; margin-top:4px;"><span>-40°C</span><span>40°C</span></div>';
    }

    // Setup temperature tooltip for main map
    function setupTempTooltip() {
      const tooltip = document.getElementById('temp-tooltip');
      let timer;
      let lastRequestId = 0;

      map.on('mousemove', (e) => {
        const tempCheckbox = document.getElementById('layer-temp');
        if (!tempCheckbox || !tempCheckbox.checked) {
          tooltip.style.display = 'none';
          return;
        }

        const rect = map.getContainer().getBoundingClientRect();
        tooltip.style.display = 'block';
        tooltip.style.left = (rect.left + e.point.x + 6) + 'px';
        tooltip.style.top = (rect.top + e.point.y + 6) + 'px';
        tooltip.style.transform = 'none';

        clearTimeout(timer);
        timer = setTimeout(() => {
          const requestId = ++lastRequestId;
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${e.lngLat.lat}&longitude=${e.lngLat.lng}&current=temperature_2m`)
            .then(res => res.json())
            .then(data => {
              if (requestId !== lastRequestId) return; // drop stale responses
              if (data.current) {
                tooltip.innerHTML = `<div style="font-weight:bold; font-size:16px;">${Math.round(data.current.temperature_2m)}°C</div>`;
              }
            })
            .catch(() => { });
        }, 100);
      });

      map.on('mouseout', () => tooltip.style.display = 'none');
    }

  </script>
</body>

</html>
